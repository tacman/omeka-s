# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:

    # Default HTML attributes to add to all icons
    default_icon_attributes:

        # Use current text color to fill the icon
        fill: currentColor

        # Default dimensions
        height: '1em'
        width: '1em'

    # Throw an exception if an icon is not
    ignore_not_found: false

    aliases:
        add: 'mdi:plus-circle-outline'
        edit: 'mdi:pencil-outline'
        delete: 'mdi:trash-can-outline'
        view: 'mdi:eye-outline'
        browse: 'mdi:view-list-outline'
        search: 'mdi:magnify'
        settings: 'mdi:cog-outline'
        users: 'mdi:account-multiple-outline'
        pages: 'mdi:file-document-outline'
        navigation: 'mdi:menu'
        resources: 'mdi:database-outline'
        theme: 'mdi:palette-outline'
        public: 'mdi:open-in-new'
        admin: 'mdi:shield-account-outline'
        site: 'mdi:web'
        item: 'mdi:package-variant'
        item_set: 'mdi:package-variant-closed'
        media: 'mdi:image-outline'
        vocabulary: 'mdi:book-open-variant'
        resource_template: 'mdi:clipboard-text-outline'
        jobs: 'mdi:clipboard-list-outline'
        assets: 'mdi:folder-outline'
        modules: 'mdi:puzzle-outline'
        login: 'mdi:login'
        logout: 'mdi:logout'
        help: 'mdi:help-circle-outline'
        save: 'mdi:content-save-outline'
        cancel: 'mdi:close-circle-outline'
        external: 'mdi:open-in-new'

when@prod:
    ux_icons:
        # Suppress exceptions for missing icons in production
        ignore_not_found: true
